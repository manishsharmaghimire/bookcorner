spring:
  application:
    name: bookcorner-backend

  profiles:
    active: local

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

---
# Local profile: MySQL database
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookcorner}
    username: ${DB_USERNAME:bookcorner}
    password: ${DB_PASSWORD:bookcorner}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect


otp:
  ttl: 5m
  resend-cool-down: 1m
  max-attempts: 5
  hmac-secret: bookcorner-otp-secret

jwt:
  secret: Ym9va2Nvcm5lci1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
  access-token-expiration: 15m
  refresh-token-expiration: 7d

esewa:
  merchant-id: EPAYTEST
  secret-key: 8gBm/:&EnhH.1/q
  payment-url: https://rc-epay.esewa.com.np/api/epay/main/v2/form
  verification-url: https://rc-epay.esewa.com.np/api/epay/transaction/status/
  success-url: http://localhost:8080/api/payments/esewa/success
  failure-url: http://localhost:8080/api/payments/esewa/failure
---
# Postgres profile: real database for staging/production.


# bookcorner.jwt.secret / accessTokenExpiryMinutes / refreshTokenExpiryDays
# are read from JwtProperties (default dev secret baked in there) — override
# via BOOKCORNER_JWT_SECRET in real deployments, never ship the default.
